name: Claude Code Review

# Replaces the claude.ai routine (claude.ai/code/routines) that used to drive PR
# review, along with the 242-line claude-pr-review.yml that existed only to
# scrape the routine's comment for a marker and a Verdict line.
#
# The routine posted a fresh comment every time it revised a review instead of
# editing the one it had already posted, so PRs #135-#138 collected 20 review
# comments where 4 were intended. That was not fixable from here: a routine's
# prompt and triggers live in a claude.ai dashboard rather than the repo, and
# each matching GitHub event starts its own cloud session with no dedupe and no
# way to cancel a superseded run.
#
# Running the review as an action puts the three missing controls in this file:
#   use_sticky_comment  -> one comment per PR, edited in place on every re-run
#   cancel-in-progress  -> a push landing mid-review cancels the stale run
#   --max-turns         -> a runaway-cost ceiling, backed by timeout-minutes
#
# The sticky comment, not the turn cap, is what makes duplicates impossible:
# there is one comment and every run edits it. --max-turns only bounds spend.
#
# Auth is a subscription-backed OAuth token (generate with `claude setup-token`,
# store as the CLAUDE_CODE_OAUTH_TOKEN secret), so reviews draw down the same
# Pro/Max allowance the routine did rather than API credits.
#
# Advisory only: the job succeeds whatever the review finds, and nothing here
# gates a merge.
#
# Deliberately NOT filtered to `branches: [main]`. ci.yml and docker-build.yml
# are, which is why neither ran on PR #138 while it was still based on
# linters/02-werror. A review is worth having on stacked PRs too.

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

# One review at a time per PR. A push that lands while a review is still running
# cancels it, so a burst of commits costs about one review instead of one each.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Claude review
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history so the review can diff against the base branch, and so the
      # repo's own .claude/ skills and rules are on disk for the session.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          use_sticky_comment: true
          # Required, and the reason no review was ever posted. A custom
          # `prompt` on a pull_request event is "automation mode", which creates
          # no tracking comment and so never registers the comment MCP tool.
          # action.yml: track_progress "forces tag mode with tracking comments
          # for pull_request and issue events", default false. Without it the
          # reviewer wrote a full review, went looking for
          # mcp__github_comment__update_claude_comment, found nothing (four
          # ToolSearch calls in the transcript), fell back to `gh pr comment`,
          # was denied, and the job still exited 0.
          #
          # use_sticky_comment above is what keeps that to ONE comment edited in
          # place; track_progress alone would still be a comment per run.
          track_progress: true
          # The skill is named by path rather than invoked as `/code-review`.
          # The repo skill shares its name with the built-in /code-review
          # command, which is marked disable-model-invocation; naming the path
          # removes the ambiguity.
          prompt: |
            Review the changes in this pull request against its base branch.

            Follow the checklist in .claude/skills/code-review/SKILL.md and the
            conventions in .claude/rules/. Each rule's `paths:` frontmatter says
            which files it governs; rules without frontmatter always apply.

            Post the findings by calling mcp__github_comment__update_claude_comment,
            which edits the one sticky comment this PR already has. Do NOT use
            `gh pr comment` or `gh api` to post: that adds a new comment per run,
            which is the duplicate spam this workflow exists to prevent, and it is
            denied anyway.

            Group findings by severity (Critical, Suggestion, Nit), each citing
            file:line. Lead with a one-line tally. If nothing is worth raising,
            say so in one line instead of padding the comment.
          # The turn cap went 8 -> 30 and still failed, 9 of 10 runs dying at
          # exactly 31. 50 fixed that; runs now land at 23-32, so the headroom is
          # real but no longer the binding constraint. timeout-minutes above is
          # the harder backstop and nothing has come near it (2.3 min of 20).
          #
          # The tool grants come from reading an actual execution transcript
          # rather than guessing, which is what the upload step below is for.
          # Per the action's configuration docs Claude "does not have access to
          # execute arbitrary Bash commands by default", and SKILL.md opens by
          # saying to run `git diff`, so every run was denying its own first
          # instruction. The git entries fixed that: git status/log/diff/show all
          # run now. `:*` rather than the docs' bare `Bash(git diff)` is required
          # because the review diffs against the base branch with arguments.
          #
          # `gh pr view` is here because the review spent five turns trying to
          # read the PR title and body and being denied each time. It is
          # read-only.
          #
          # `gh pr comment` is deliberately NOT granted, and the prompt above
          # says so. It is the obvious one-line fix for the review posting
          # nothing, and it is the wrong one: a fresh comment per run is exactly
          # the duplicate spam this workflow replaced the claude.ai routine to
          # stop. Posting goes through the sticky-comment tool instead.
          claude_args: >-
            --max-turns 50
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git status:*),Bash(git show:*),Bash(gh pr view:*)"

      # Diagnostic. The workflow log records that N tool calls were denied but
      # never which ones, and every run so far has denied 8-16 -- including the
      # two that reported success and still posted no review comment. This
      # uploads the execution transcript the action already writes, so the
      # denied tool names are recoverable instead of guessed at.
      #
      # `if: always()` because the runs worth reading are the failed ones, and
      # the path comes from the action's own execution_file output rather than
      # a hardcoded runner temp path.
      #
      # Remove this once the denials are understood; it is not load-bearing.
      - name: Upload Claude execution log
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v7
        with:
          name: claude-execution-output-${{ github.event.pull_request.number }}
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 7
          if-no-files-found: warn
