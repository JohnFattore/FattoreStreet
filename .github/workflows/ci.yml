name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-app
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Matches the react-build stage in nginx/Dockerfile, so CI tests the
          # bundle on the same Node that builds the production image. Node 20
          # went EOL in April 2026 and was already too old for current devDeps:
          # jsdom 30 requires ^22.22.2 || ^24.15.0 || >=26.0.0 and every vitest
          # worker died on 20 with "webidl.util.markAsUncloneable is not a
          # function".
          node-version: "26"
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lint styles (Stylelint)
        run: npm run lint:styles

      - name: Format check (Prettier)
        run: npm run format:check

      # index.html links the gitignored custom.css, so without this Vite only
      # warns and still exits 0, emitting a bundle missing the theme stylesheet.
      # Mirrors the sass step in nginx/Dockerfile.
      - name: Compile Sass
        run: npx sass src/styles/custom.scss src/styles/custom.css

      - name: Build (TypeScript + Vite)
        run: npm run build

      - name: Test
        run: npx vitest --run

  django:
    name: Django tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: django
    env:
      SECRET_KEY: ci-test-secret-key-not-for-production  # pragma: allowlist secret
      DATABASE: sqlite
      REDIS_URL: redis://127.0.0.1:6379/0
      # Required by chatbot.views; tests mock Gemini — value is not a real API key.
      GOOGLE_API_KEY: ci-dummy-google-api-key-placeholder  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: django/uv.lock

      - name: Install dependencies
        # Python version comes from django/.python-version (matches the
        # base image in django/Dockerfile); uv installs it if missing.
        run: uv sync --frozen

      - name: Run tests
        run: uv run python manage.py test

  springboot:
    name: Spring Boot (lint, test, verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: springboot
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Fast gate first: fails in seconds, before the 564-test suite. Runs as a
      # standalone goal (not just via the validate binding) so a formatting
      # failure is its own red step rather than buried in the test job's log.
      - name: Format check (Spotless)
        run: ./mvnw -B -ntp spotless:check

      - name: Lint (Checkstyle)
        run: ./mvnw -B -ntp checkstyle:check

      # verify, not test: `jacoco:check` binds to verify, so the coverage floor
      # in pom.xml was never actually enforced by CI before this. verify also
      # runs spring-boot:repackage, so packaging failures surface here instead
      # of only in docker-build.yml.
      - name: Build, test & verify
        run: ./mvnw -B -ntp verify

      # always(): the job stops at the first failed step, so without this a
      # coverage failure would report the threshold but not the report showing
      # which package dropped.
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: springboot-jacoco
          path: springboot/target/site/jacoco/
          retention-days: 7

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: springboot-spotbugs
          path: springboot/target/spotbugsXml.xml
          retention-days: 7

  secrets:
    name: Secret scan (detect-secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run detect-secrets hook
        run: pre-commit run detect-secrets --all-files
