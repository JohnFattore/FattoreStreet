[project]
name = "fattorestreet-django"
version = "0.1.0"
description = "FattoreStreet Django backend API"
requires-python = ">=3.14"
dependencies = [
    # The Django Framework
    "Django==6.0.6",
    # Security for communication with the react frontend
    "django-cors-headers==4.9.0",
    # API library
    "djangorestframework==3.18.0",
    # User authentication using tokens
    "djangorestframework-simplejwt==5.5.1",
    # Gunicorn HTTP server
    "gunicorn==26.0.0",
    # PostgreSQL to Python library
    "psycopg2-binary==2.9.12",
    # Environment Variables
    "django-environ==0.14.0",
    # HTTP requests from python
    "requests==2.34.2",
    # History
    "django-simple-history==3.13.0",
    # YFinance API
    "yfinance==1.6.0",
    # Redis library for the Django cache backend
    "redis==8.1.0",
    # pandas for numerical computations
    "pandas==3.0.5",
    "numpy==2.5.2",
    # Google Gemini SDK
    "google-genai==2.18.1",
    "django-redis==7.0.0",
    "pandas-market-calendars==5.4.0",
]
