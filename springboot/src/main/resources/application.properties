spring.application.name=sec-api
spring.config.import=optional:file:.env[.properties]

# Run mode: "server" (default, serve the API), "hist-load" (run the IEX HIST price load once and exit),
# "index-load" (refresh index metrics + rebuild the Fattore indexes once and exit),
# "fundamentals-load" (sync SEC XBRL frames quarterly financials once and exit),
# "asset-load" (load the SEC ticker universe + ETF identities once and exit), or
# "validate-prices" (compare stored adjusted closes against the reference series and report, then exit).
# The one-shot modes power the ephemeral Fargate scheduled tasks; see deploy/terraform/README.md.
app.run-mode=${APP_RUN_MODE:server}
app.hist-load.days=${HIST_LOAD_DAYS:20}
# Run corporate-action price adjustment after the one-shot load (hist-load mode only).
app.hist-load.adjust-enabled=${HIST_LOAD_ADJUST_ENABLED:true}
# Restrict that adjustment to non-fund tickers. ETF detection fetches hundreds of filings per fund
# and dominates the runtime; the scheduled Fargate task sets this to true.
app.hist-load.equity-only=${HIST_LOAD_EQUITY_ONLY:false}
# Index whose members are eligible for automatic SEC corporate-action detection. The price universe
# is the full IEX HIST symbol set (~24k tickers, most with no SEC counterpart), which takes days to
# re-scan at the SEC rate limit; scoping to an index keeps a nightly run bounded. Blank scans every
# ticker with prices. force=true bypasses this scope.
app.price-adjustment.detection-index-code=${PRICE_ADJUSTMENT_DETECTION_INDEX:FAT1000}
app.index-load.year=${INDEX_LOAD_YEAR:0}
app.index-load.scope=${INDEX_LOAD_SCOPE:russell1000}
app.index-load.skip-refresh=${INDEX_LOAD_SKIP_REFRESH:false}
app.index-load.ticker=${INDEX_LOAD_TICKER:}
app.index-load.min-processed=${INDEX_LOAD_MIN_PROCESSED:800}

# Fundamentals load (XBRL frames sync). Frames are fetched per (concept, period), so a full
# 2009-to-present sync is thousands of multi-megabyte SEC requests re-reading settled filings.
# The nightly run covers years-back years through the current year; two calendar years absorbs
# amendments and late filers, and quarters upsert by (asset, year, quarter) so restating is safe.
# Set start-year to pin an explicit first year (e.g. 2009) for a backfill run.
app.fundamentals-load.years-back=${FUNDAMENTALS_LOAD_YEARS_BACK:1}
app.fundamentals-load.start-year=${FUNDAMENTALS_LOAD_START_YEAR:0}

# Asset load (SEC ticker universe). Overwrite ETF identities that are already resolved rather than
# only filling gaps; the monthly scheduled run leaves resolved identities alone.
app.asset-load.overwrite-existing=${ASSET_LOAD_OVERWRITE_EXISTING:false}

# Adjusted-price validation (read-only diagnostics, weekly). Scoped to one index because the price
# universe is the full IEX HIST symbol set and comparing all of it is neither useful nor bounded.
# The report goes to SNS as plain text; a blank topic ARN means log-only. max-tickers 0 means no cap.
app.validate-prices.index-code=${VALIDATE_PRICES_INDEX_CODE:FAT1000}
app.validate-prices.min-date=${VALIDATE_PRICES_MIN_DATE:2016-01-01}
app.validate-prices.sns-topic-arn=${VALIDATE_PRICES_SNS_TOPIC_ARN:}
app.validate-prices.max-tickers=${VALIDATE_PRICES_MAX_TICKERS:0}

# Must match Django SECRET_KEY (SimpleJWT HS256 access tokens). Spring validates Bearer JWTs for /admin/**.
app.django-jwt-secret=${SECRET_KEY:}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/springboot}
spring.datasource.username=${DB_USERNAME:postgres}
# pragma: allowlist nextline secret
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
# On a database that predates Flyway (schema exists, no flyway_schema_history),
# baseline at V1 instead of failing; a fresh database runs V1__initial_schema.sql.
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=${SHOW_JPA_SQL:false}
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

llm.server.url=${LLM_SERVER_URL:http://localhost:8081}
sec.http.connect-timeout-ms=${SEC_HTTP_CONNECT_TIMEOUT_MS:15000}
sec.http.read-timeout-ms=${SEC_HTTP_READ_TIMEOUT_MS:120000}
sec.http.retry-max-attempts=${SEC_HTTP_RETRY_MAX_ATTEMPTS:3}
sec.http.retry-base-backoff-ms=${SEC_HTTP_RETRY_BASE_BACKOFF_MS:1000}
sec.http.min-interval-ms=${SEC_HTTP_MIN_INTERVAL_MS:250}
sec.contact-email=${SEC_CONTACT_EMAIL:}
# FRED (Federal Reserve Economic Data) API key for the /fred-data endpoint.
fred.api-key=${FRED_API_KEY:}
