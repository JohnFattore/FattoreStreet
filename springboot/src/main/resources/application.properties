spring.application.name=sec-api
spring.config.import=optional:file:.env[.properties]

# Run mode: "server" (default, serve the API) or "hist-load" (run the IEX HIST price load once and exit).
# The one-shot mode powers the ephemeral Fargate scheduled task; see deploy/terraform/README.md.
app.run-mode=${APP_RUN_MODE:server}
app.hist-load.days=${HIST_LOAD_DAYS:20}

# Must match Django SECRET_KEY (SimpleJWT HS256 access tokens). Spring validates Bearer JWTs for /admin/**.
app.django-jwt-secret=${SECRET_KEY:}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/springboot}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_JPA_SQL:false}
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

llm.server.url=${LLM_SERVER_URL:http://localhost:8081}
sec.http.connect-timeout-ms=${SEC_HTTP_CONNECT_TIMEOUT_MS:15000}
sec.http.read-timeout-ms=${SEC_HTTP_READ_TIMEOUT_MS:120000}
sec.http.retry-max-attempts=${SEC_HTTP_RETRY_MAX_ATTEMPTS:3}
sec.http.retry-base-backoff-ms=${SEC_HTTP_RETRY_BASE_BACKOFF_MS:1000}
sec.http.min-interval-ms=${SEC_HTTP_MIN_INTERVAL_MS:250}
sec.contact-email=${SEC_CONTACT_EMAIL:}