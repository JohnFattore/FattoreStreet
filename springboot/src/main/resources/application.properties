spring.application.name=sec-api
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sec-api}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

llm.server.url=${LLM_SERVER_URL:http://localhost:8081}
sec.http.connect-timeout-ms=${SEC_HTTP_CONNECT_TIMEOUT_MS:15000}
sec.http.read-timeout-ms=${SEC_HTTP_READ_TIMEOUT_MS:120000}
sec.http.retry-max-attempts=${SEC_HTTP_RETRY_MAX_ATTEMPTS:3}
sec.http.retry-base-backoff-ms=${SEC_HTTP_RETRY_BASE_BACKOFF_MS:1000}
sec.http.min-interval-ms=${SEC_HTTP_MIN_INTERVAL_MS:250}