# FattoreStreet stateful infrastructure -- postgres, redis, pgadmin.
#
# NOT part of the deploy unit: routine deploys (docker compose pull/up in this
# directory) never touch these services. Manage them explicitly with:
#   docker compose -f docker-compose.infra.yml up -d

name: fattorestreet-infra

services:
  # POSTGRES_PASSWORD is the single DB-password key: the postgres image reads it
  # ONLY during first-time init (empty data dir), and django + springboot use the
  # same key to connect. With an already-initialized volume the entrypoint
  # ignores it -- the real password lives in the volume + in fattorestreet/env
  # (POSTGRES_PASSWORD).
  #
  # FRESH VOLUME ONLY: to re-initialize from an empty /mnt/ebs/postgres-data,
  # fetch the password from the secret on the host (the EC2 instance role can
  # read it) and pass it just for that run:
  #   PW=$(aws secretsmanager get-secret-value --secret-id "$SECRETS_ARN" \
  #         --query SecretString --output text | jq -r .POSTGRES_PASSWORD)
  #   POSTGRES_PASSWORD="$PW" docker compose -f docker-compose.infra.yml up -d postgres
  postgres:
    image: postgres:17
    container_name: postgres
    volumes:
      - /mnt/ebs/postgres-data:/var/lib/postgresql/data
    ports:
      - "0.0.0.0:5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    networks: [dockerNet]
    restart: unless-stopped

  # Major pinned like postgres; bump deliberately with the redis-py/django-redis
  # client pins in django/pyproject.toml.
  redis:
    image: redis:8
    container_name: redis
    ports:
      - "6379:6379"
    networks: [dockerNet]
    restart: unless-stopped

  # PGADMIN_DEFAULT_PASSWORD seeds the admin account ONLY on first run (empty
  # /mnt/ebs/pgadmin-data, which pgadmin's uid 5050 must own); the image
  # hard-fails at startup if it's empty then. Persisted in the volume
  # thereafter, when the env is ignored -- same lifecycle as POSTGRES_PASSWORD
  # above. FRESH VOLUME ONLY, fetch it from the secret on the host:
  #   sudo mkdir -p /mnt/ebs/pgadmin-data && sudo chown 5050:5050 /mnt/ebs/pgadmin-data
  #   PW=$(aws secretsmanager get-secret-value --secret-id "$SECRETS_ARN" \
  #         --query SecretString --output text | jq -r .PGADMIN_DEFAULT_PASSWORD)
  #   PGADMIN_DEFAULT_PASSWORD="$PW" docker compose -f docker-compose.infra.yml up -d pgadmin4
  #
  # Least privilege: no host port (nginx reaches pgadmin4:80 over dockerNet),
  # read-only rootfs (only the data volume and /tmp are writable), all Linux
  # capabilities dropped, and no privilege escalation. The DB connection
  # registered in pgadmin should use the read-only pgadmin_ro role, not
  # postgres -- see sql/pgadmin-readonly.sql.
  pgadmin4:
    image: dpage/pgadmin4
    container_name: pgadmin4
    volumes:
      - /mnt/ebs/pgadmin-data:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: johnefattore@gmail.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-}
      # Pinned: newer images default to 8080, which would silently break the
      # nginx upstream (http://pgadmin4) on an image pull
      PGADMIN_LISTEN_PORT: 80
    read_only: true
    tmpfs:
      - /tmp
      - /var/log/pgadmin
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [dockerNet]
    restart: unless-stopped

networks:
  dockerNet:
    external: true
