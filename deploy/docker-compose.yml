# FattoreStreet app services -- the deploy unit.
#
# SAFE TO COMMIT: no secret values live in this file. All app config/credentials
# come from a single AWS Secrets Manager secret (fattorestreet/env); each app
# container is passed only its ARN via SECRETS_ARN (from ./.env, see
# .env.example) and fetches the rest at start (see each image's
# docker-entrypoint.sh). Stateful infra (postgres/redis/pgadmin) lives in
# docker-compose.infra.yml and is never touched by a deploy.
#
# Routine deploys are automated: every merge to main builds + publishes the
# images to GHCR (latest + commit SHA) and runs deploy.sh here via SSM (see
# DEPLOY.md). Manually, from this directory:
#   sudo ./deploy.sh <sha>          # or bare for :latest
# rollback = deploy an older commit's SHA tag:
#   sudo ./deploy.sh <old-sha>
# migrate (deploy.sh already does this):
#   docker compose run --rm django python manage.py migrate

name: fattorestreet

services:
  django:
    image: ghcr.io/johnfattore/django:${TAG:-latest}
    container_name: django
    env_file: .env
    networks: [dockerNet]
    restart: unless-stopped

  springboot:
    image: ghcr.io/johnfattore/springboot:${TAG:-latest}
    container_name: springboot
    env_file: .env
    networks: [dockerNet]
    restart: unless-stopped

  nginx:
    image: ghcr.io/johnfattore/nginx:${TAG:-latest}
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /mnt/ebs/certbot/letsencrypt:/etc/letsencrypt
      - /mnt/ebs/certbot/www:/var/www/certbot
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: nginx-logs
        # tag templates the CloudWatch log stream name per container
        tag: nginx-{{.ID}}
    # start after the backends; nginx.conf re-resolves their IPs every 10s
    # via Docker DNS, so recreated backends are picked up without a restart
    depends_on: [django, springboot]
    # pgadminNet: pgadmin4 is isolated there (docker-compose.infra.yml); nginx
    # joins it to proxy /pgadmin4/
    networks: [dockerNet, pgadminNet]
    restart: unless-stopped

networks:
  dockerNet:
    external: true
  pgadminNet:
    external: true
