repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        # Kept on one line: a folded scalar (>-) joins with spaces, which lands
        # inside the alternation and silently stops the patterns matching.
        exclude: \.env.*|llm/|node_modules/
