repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        # The .specify entries are spec-kit's install manifests: SHA-256 file
        # checksums that scan as high-entropy strings. They are JSON, so an
        # inline `pragma: allowlist secret` would make them unparseable for the
        # tool that reads them. Scoped to those two files so the rest of
        # .specify/ (scripts, templates) stays scanned.
        # Kept on one line: a folded scalar (>-) joins with spaces, which lands
        # inside the alternation and silently stops the patterns matching.
        exclude: \.env.*|llm/|node_modules/|\.specify/integrations/.*\.manifest\.json|\.specify/memory/\.constitution-template\.json
