events {}
http {
    include    mime.types;

    proxy_buffer_size       16k;
    proxy_buffers           8 32k;
    proxy_busy_buffers_size 64k;
    proxy_temp_file_write_size 64k;

    # server block for SSL challenges
    server {
        listen 80;
        server_name fattorestreet.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name fattorestreet.com;

        ssl_certificate /etc/letsencrypt/live/fattorestreet.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fattorestreet.com/privkey.pem;

        # Docker embedded DNS – re-resolve upstream hostnames every 10s
        resolver 127.0.0.11 valid=10s;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            root /var/www/dist;
            # accomidates react router
            try_files $uri /index.html;
        }

        location /users/api/ {
            set $upstream_django http://django:8000;
            proxy_pass $upstream_django;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_redirect off;
        }

        location /portfolio/api/ {
            set $upstream_django http://django:8000;
            proxy_pass $upstream_django;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_redirect off;
        }

        location /restaurants/api/ {
            set $upstream_django http://django:8000;
            proxy_pass $upstream_django;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_redirect off;
        }

        location /blog/api/ {
            set $upstream_django http://django:8000;
            proxy_pass $upstream_django;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_redirect off;
        }

        location /chatbot/api/ {
            set $upstream_django http://django:8000;
            proxy_pass $upstream_django;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_redirect off;
        }

        location /entertainment/ {
            set $upstream_django http://django:8000;
            proxy_pass $upstream_django;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_redirect off;
        }

        location /admin/ {
            set $upstream_django http://django:8000;
            proxy_pass $upstream_django;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_redirect off;
        }

        location /springboot/ {
            set $upstream_springboot http://springboot:8080;
            rewrite ^/springboot(/.*)$ $1 break;
            proxy_pass $upstream_springboot;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_redirect off;
        }

        location /pgadmin4/ {
            set $upstream_pgadmin http://pgadmin4;
            rewrite ^/pgadmin4(/.*)$ $1 break;
            proxy_pass $upstream_pgadmin;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_set_header X-Script-Name /pgadmin4;
            proxy_redirect off;
        }

        location /static/ {
            root /var/www;
        }
    }

    server {
        # redirect any subdomains to fattorestreet.com
        listen 443 ssl;
        server_name *.fattorestreet.com;
        return 301 $scheme://fattorestreet.com$request_uri;
    }
    # server block here
}